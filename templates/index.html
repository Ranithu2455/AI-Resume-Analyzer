<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            width:500px;
            padding:40px;
            border-radius:20px;
            box-shadow:0 20px 40px rgba(0,0,0,0.3);
            text-align:center;
        }

        h1{
            color:#0f172a;
            margin-bottom:10px;
        }

        p{
            color:#64748b;
            margin-bottom:30px;
        }

        input[type=file]{
            width:100%;
            padding:15px;
            border:2px dashed #3b82f6;
            border-radius:10px;
            margin-bottom:20px;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:15px 30px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            width:100%;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>🤖 AI Resume Analyzer</h1>

    <p>
        Upload your resume and receive an automated analysis,
        score and improvement suggestions.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="file" name="resume" required>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

</body>
</html>
